<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Savorite – prototype</title>
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="app.css">
</head>
<body>

<div class="phone">
  <div class="view on" id="today"></div>
  <div class="view split" id="deal"></div>
  <div class="view" id="create"></div>
  <div class="view" id="deck"></div>
  <div class="modal" id="modal"></div>
  <div class="toast" id="toast"></div>
  <div class="nav" id="nav"></div>
</div>

<script>
const GOAL = { cal: 2000, pro: 100, fib: 30 };

let cards = [
  { id: 1, t: 'Spicy Ramen Bowl', e: '🍜', cal: 480, pro: 24, fib: 6, min: 20,
    ing: ['ramen noodles', 'soft egg', 'bok choy', 'chili oil', 'broth'],
    steps: ['Simmer broth with chili oil.', 'Cook noodles 3 min.', 'Top with egg and bok choy.'],
    by: 'You' },
  { id: 2, t: 'Avocado Toast', e: '🥑', cal: 320, pro: 11, fib: 9, min: 5,
    ing: ['bread', 'avocado', 'egg', 'lemon'],
    steps: ['Toast bread.', 'Mash avocado with lemon.', 'Top with egg.'],
    by: 'You' },
  { id: 3, t: 'Greek Salad Wrap', e: '🌯', cal: 410, pro: 18, fib: 8, min: 10,
    ing: ['tortilla', 'feta', 'cucumber', 'tomato', 'chickpeas'],
    steps: ['Chop veg.', 'Toss with feta and chickpeas.', 'Wrap tightly.'],
    by: 'Maya' },
  { id: 4, t: 'Lentil Curry', e: '🍛', cal: 520, pro: 26, fib: 15, min: 30,
    ing: ['lentils', 'spinach', 'coconut milk', 'rice', 'onion'],
    steps: ['Sauté onion.', 'Simmer lentils 20 min.', 'Stir in spinach.'],
    by: 'Chef Rosa' },
  { id: 5, t: 'Chicken Rice Bowl', e: '🍗', cal: 560, pro: 42, fib: 5, min: 25,
    ing: ['chicken', 'rice', 'spinach', 'onion', 'lemon'],
    steps: ['Sear chicken.', 'Cook rice.', 'Assemble with greens.'],
    by: 'Chef Rosa' }
];

const days = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];
let day = 2;

let plan = days.map(() => [null, null, null]);
plan[2] = [2, 3, null];

const slots = ['BREAKFAST', 'LUNCH', 'DINNER'];

const pantryAll = ['egg', 'bread', 'avocado', 'rice', 'spinach', 'chicken',
                   'lentils', 'onion', 'lemon', 'tomato', 'chickpeas', 'tortilla'];
let pantry = ['egg', 'bread', 'avocado', 'rice', 'spinach', 'onion', 'lemon'];

const IG = {
  egg: [70, 6, 0], bread: [80, 3, 2], avocado: [160, 2, 7], rice: [200, 4, 1],
  spinach: [10, 1, 1], chicken: [250, 38, 0], lentils: [230, 18, 16],
  onion: [40, 1, 2], 'olive oil': [120, 0, 0], tomato: [20, 1, 1]
};

let draft = [];
let draftSteps = [''];
let showAddIng = false;

const $ = id => document.getElementById(id);
const byId = i => cards.find(c => c.id == i);

const escapeHtml = s => String(s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const attr = s => String(s)
  .replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');

function toast(m) {
  const t = $('toast');
  t.textContent = m;
  t.classList.add('on');
  setTimeout(() => t.classList.remove('on'), 1600);
}

function stamps(c) {
  return `<span class="stamp">${c.cal} CAL</span>`
       + `<span class="stamp">${c.pro}g PROTEIN</span>`
       + `<span class="stamp">${c.fib}g FIBER</span>`;
}

function mini(c, extra = '') {
  return `
    <div class="card" onclick="open_(${c.id})">
      ${extra}
      <div class="card-row">
        <span class="em">${c.e}</span>
        <div>
          <div class="ttl">${escapeHtml(c.t)}</div>
          <div class="meta">${c.min} min · by ${escapeHtml(c.by)}</div>
        </div>
      </div>
      ${stamps(c)}
    </div>`;
}

function bar(l, v, g, u) {
  const p = Math.min(100, v / g * 100);
  return `
    <div class="bar">
      <div class="t"><span>${l}</span><span>${v} / ${g}${u}</span></div>
      <div class="track"><div class="fill" style="width:${p}%"></div></div>
    </div>`;
}

function tot() {
  let s = { cal: 0, pro: 0, fib: 0 };
  plan[day].forEach(i => {
    if (i) {
      const c = byId(i);
      s.cal += c.cal; s.pro += c.pro; s.fib += c.fib;
    }
  });
  return s;
}

/* ---- Today ---------------------------------------------------------- */

function rToday() {
  const s = tot();
  $('today').innerHTML = `
    <h1>Your hand today</h1>
    <div class="sub">Plan meals with cards. Hit your goals without counting.</div>
    <div class="days">
      ${days.map((d, i) => `<div class="${i == day ? 'on' : ''}" onclick="day=${i};rToday()">${d}</div>`).join('')}
    </div>
    ${bar('Calories', s.cal, GOAL.cal, '')}
    ${bar('Protein', s.pro, GOAL.pro, 'g')}
    ${bar('Fiber', s.fib, GOAL.fib, 'g')}
    <h2>Meals</h2>
    ${plan[day].map((id, i) => `
      <div class="slot">
        <div>
          <small>${slots[i]}</small>
          <div>${id ? byId(id).e + ' ' + escapeHtml(byId(id).t) : 'Empty slot'}</div>
        </div>
        <button class="chip on tight" onclick="pick(${i})">${id ? 'Swap' : '+ Add'}</button>
      </div>`).join('')}
    <button class="btn" onclick="tab('deal')">Deal me a hand from my pantry</button>`;
}

function pick(i) {
  $('modal').innerHTML = `
    <button class="x inset" onclick="closeM()" aria-label="Close">✕</button>
    <h1>Choose a card</h1>
    <div class="sub">for ${slots[i].toLowerCase()}</div>
    <div class="hand mt-12">
      ${cards.map(c => `
        <div onclick="plan[day][${i}]=${c.id};closeM();rToday()">
          ${mini(c).replace(/onclick="open_\(\d+\)"/, '')}
        </div>`).join('')}
    </div>`;
  $('modal').classList.add('on');
}

function closeM() { $('modal').classList.remove('on'); }

/* ---- Deal ----------------------------------------------------------- */

function score(c) {
  const h = c.ing.filter(x => pantry.some(p => x.includes(p) || p.includes(x))).length;
  return Math.round(h / c.ing.length * 100);
}

function rDeal() {
  const h = [...cards].sort((a, b) => score(b) - score(a)).slice(0, 4);
  $('deal').innerHTML = `
    <div class="deal-head">
      <h1>Deal a hand</h1>
      <div class="sub">Cards ranked by what's in your pantry.</div>
      <button class="pantry-btn" onclick="openPantry()">
        <span class="pb-icon">🥕</span>
        <span class="pb-label">
          <small>YOUR PANTRY</small>
          <b>${pantry.length} of ${pantryAll.length} ingredients</b>
        </span>
        <span class="pb-arrow">→</span>
      </button>
      <h2>Your hand</h2>
    </div>
    <div class="deal-hand">
      ${h.map(c => mini(c, `<span class="match">${score(c)}% match</span>`)).join('')}
    </div>`;
}

function openPantry() {
  $('modal').innerHTML = `
    <button class="x inset" onclick="closeM()" aria-label="Close">✕</button>
    <h1>Your pantry</h1>
    <div class="sub">Tap what you have. Cards will rank by what you can actually cook.</div>
    <h2>Ingredients</h2>
    <div class="pantry-grid">
      ${pantryAll.map(p => `
        <button class="chip ${pantry.includes(p) ? 'on' : ''}"
                data-ing="${attr(p)}"
                onclick="tp(this.dataset.ing, this)">${escapeHtml(p)}</button>`).join('')}
    </div>
    <h2>Add your own</h2>
    <input id="pi" placeholder="e.g. sesame oil"
           onkeydown="if(event.key==='Enter'){event.preventDefault();addPantryItem()}">
    <button class="btn" onclick="addPantryItem()">Add to pantry</button>
    <button class="btn o" onclick="closeM()">Done</button>`;
  $('modal').classList.add('on');
}

function tp(p, el) {
  pantry = pantry.includes(p) ? pantry.filter(x => x != p) : [...pantry, p];
  if (el) el.classList.toggle('on', pantry.includes(p));
  rDeal();
}

function addPantryItem() {
  const el = $('pi');
  const v = el.value.trim().toLowerCase();
  if (!v) return;
  if (!pantryAll.includes(v)) pantryAll.push(v);
  if (!pantry.includes(v)) pantry.push(v);
  openPantry();
  rDeal();
}

/* ---- Card view ------------------------------------------------------ */

function open_(id) {
  const c = byId(id);
  $('modal').innerHTML = `
    <div class="relative">
      <button class="x" onclick="closeM()" aria-label="Close card">✕</button>
      <div class="flip" id="fl" onclick="this.classList.toggle('f')">
        <div class="in">
          <div class="face">
            <div class="em">${c.e}</div>
            <h3>${escapeHtml(c.t)}</h3>
            <div class="meta">${c.min} min · by ${escapeHtml(c.by)}</div>
            <div class="mt-8">${stamps(c)}</div>
            <div class="clip">▶ 20-sec how-to clip</div>
            <div class="flip-hint">Tap card to flip</div>
          </div>
          <div class="face back">
            <h3>Ingredients</h3>
            <ul>${c.ing.map(i => `<li>${escapeHtml(i)}</li>`).join('')}</ul>
            <h3 class="small mt-8">Steps</h3>
            <ol>${c.steps.map(i => `<li>${escapeHtml(i)}</li>`).join('')}</ol>
          </div>
        </div>
      </div>
    </div>
    <button class="btn" onclick="plan[day][plan[day].indexOf(null)>-1?plan[day].indexOf(null):0]=${c.id};closeM();rToday();toast('Added to today');tab('today')">Add to today</button>
    <button class="btn o" onclick="toast('Remixed into your deck')">Remix this card</button>
    <button class="btn o" onclick="toast('Share link copied')">Share with friends</button>`;
  $('modal').classList.add('on');
}

/* ---- Create --------------------------------------------------------- */

function rCreate() {
  const s = draft.reduce(
    (a, i) => [a[0] + (IG[i]?.[0] || 0), a[1] + (IG[i]?.[1] || 0), a[2] + (IG[i]?.[2] || 0)],
    [0, 0, 0]
  );
  const titleVal = $('nt') ? $('nt').value : '';

  $('create').innerHTML = `
    <h1>Write a card</h1>
    <div class="sub">Tap ingredients and nutrition adds up automatically.</div>
    <input id="nt" placeholder="Card title (e.g. Sunday Egg Fried Rice)" value="${attr(titleVal)}">

    <h2>Ingredients</h2>
    <div class="chip-row">
      ${Object.keys(IG).map(i => `
        <button class="chip ${draft.includes(i) ? 'on' : ''}"
                data-ing="${attr(i)}"
                onclick="td(this.dataset.ing)">${escapeHtml(i)}</button>`).join('')}
    </div>

    ${showAddIng ? `
      <div class="add-form">
        <input id="ii-name" placeholder="Ingredient name">
        <div class="macro-row">
          <input id="ii-cal" type="number" placeholder="Cal" min="0">
          <input id="ii-pro" type="number" placeholder="Protein g" min="0">
          <input id="ii-fib" type="number" placeholder="Fiber g" min="0">
        </div>
        <div class="add-form-actions">
          <button class="btn o" onclick="showAddIng=false;rCreate()">Cancel</button>
          <button class="btn" onclick="addCustomIngredient()">Add</button>
        </div>
      </div>
    ` : `
      <button class="add-ing-btn" onclick="showAddIng=true;rCreate()">
        <span>+</span> Add an ingredient
      </button>
    `}

    <h2>Steps</h2>
    <div class="steps-list">
      ${draftSteps.map((step, i) => `
        <div class="step-row">
          <span class="step-num">${i + 1}</span>
          <input class="step-input"
                 value="${attr(step)}"
                 placeholder="What happens here?"
                 oninput="draftSteps[${i}]=this.value">
        </div>
      `).join('')}
    </div>
    <button class="add-ing-btn" onclick="addStep()">
      <span>+</span> Add a step
    </button>

    <h2>Nutrition stamp</h2>
    <div class="card card-static">
      <div class="ttl">Per serving</div>
      ${stamps({ cal: s[0], pro: s[1], fib: s[2] })}
    </div>

    <div class="clip">＋ Attach optional 20-sec clip</div>
    <button class="btn" onclick="saveCard()">Save to my deck</button>`;
}

function td(i) {
  draft = draft.includes(i) ? draft.filter(x => x != i) : [...draft, i];
  rCreate();
}

function addStep() {
  draftSteps.push('');
  rCreate();
  const inputs = document.querySelectorAll('.step-input');
  if (inputs.length) inputs[inputs.length - 1].focus();
}

function addCustomIngredient() {
  const name = $('ii-name').value.trim().toLowerCase();
  const cal = parseInt($('ii-cal').value, 10) || 0;
  const pro = parseInt($('ii-pro').value, 10) || 0;
  const fib = parseInt($('ii-fib').value, 10) || 0;
  if (!name) { toast('Name your ingredient'); return; }
  if (!IG[name]) IG[name] = [cal, pro, fib];
  if (!draft.includes(name)) draft.push(name);
  showAddIng = false;
  rCreate();
}

function saveCard() {
  const t = ($('nt').value || '').trim() || 'Untitled card';
  if (!draft.length) { toast('Add an ingredient first'); return; }

  const s = draft.reduce(
    (a, i) => [a[0] + (IG[i]?.[0] || 0), a[1] + (IG[i]?.[1] || 0), a[2] + (IG[i]?.[2] || 0)],
    [0, 0, 0]
  );
  const steps = draftSteps.map(x => x.trim()).filter(Boolean);

  cards.push({
    id: Date.now(),
    t,
    e: '🍽️',
    cal: s[0], pro: s[1], fib: s[2],
    min: 15,
    ing: [...draft],
    steps: steps.length ? steps : ['Add your steps…'],
    by: 'You'
  });

  draft = [];
  draftSteps = [''];
  showAddIng = false;
  toast('Card saved');
  tab('deck');
}

/* ---- Deck ----------------------------------------------------------- */

function rDeck() {
  $('deck').innerHTML = `
    <h1>My deck</h1>
    <div class="sub">${cards.length} cards · tap to flip, remix, share</div>
    <h2>Shared with you</h2>
    <div class="friend"><div class="av">M</div>Maya added Greek Salad Wrap</div>
    <div class="friend"><div class="av">R</div>Chef Rosa dropped 2 cards</div>
    <h2>All cards</h2>
    <div class="hand">${cards.map(c => mini(c)).join('')}</div>`;
}

/* ---- Tabs ----------------------------------------------------------- */

const tabs = [
  ['today',  '❧', 'Today'],
  ['deal',   '♠', 'Deal'],
  ['create', '✎', 'Create'],
  ['deck',   '❦', 'Deck']
];

function tab(t) {
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id == t));
  closeM();
  ({ today: rToday, deal: rDeal, create: () => { if (!$('nt')) rCreate(); }, deck: rDeck })[t]();
  $('nav').innerHTML = tabs.map(x => `
    <div class="${x[0] == t ? 'on' : ''}" onclick="tab('${x[0]}')">
      <b>${x[1]}</b>${x[2]}
    </div>`).join('');
}

tab('today');
</script>

</body>
</html>
