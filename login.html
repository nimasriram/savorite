<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Log in — Meal Cards</title>
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="login.css">
<link rel="stylesheet" href="vintage.css">
</head>
<body>

<main>
  <div class="brand" id="brand"></div>

  <section class="card" id="auth">
    <h1 id="title">Welcome back</h1>
    <p class="lead" id="lead">Log in to see your deck and today's plan.</p>

    <form id="f" novalidate>
      <div id="nameWrap" class="hidden">
        <label for="name">Name</label>
        <input id="name" type="text" autocomplete="name">
        <div class="err" id="e-name" aria-live="polite"></div>
      </div>

      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" inputmode="email">
      <div class="err" id="e-email" aria-live="polite"></div>

      <label for="pw">Password</label>
      <div class="field">
        <input id="pw" type="password" autocomplete="current-password">
        <button type="button" class="eye" id="eye" aria-label="Show password">Show</button>
      </div>

      <div id="meterWrap" class="hidden">
        <div class="meter"><i id="meter"></i></div>
        <div class="hint" id="strength">Use at least 8 characters.</div>
      </div>
      <div class="err" id="e-pw" aria-live="polite"></div>

      <div id="confWrap" class="hidden">
        <label for="conf">Confirm password</label>
        <input id="conf" type="password" autocomplete="new-password">
        <div class="err" id="e-conf" aria-live="polite"></div>
      </div>

      <div class="row" id="loginRow">
        <label><input type="checkbox" id="remember"> Remember me</label>
        <button type="button" class="lnk" id="forgot">Forgot password?</button>
      </div>

      <div id="form-err" role="alert"></div>
      <button class="btn" id="go" type="submit">Log in</button>
    </form>

    <div class="swap">
      <span id="swapTxt">New here?</span>
      <button type="button" class="lnk" id="swap">Create an account</button>
    </div>
  </section>

  <section class="card welcome hidden" id="home">
    <div class="big">🍳</div>
    <h1 id="hi">You're in</h1>
    <p class="lead">Your deck and meal plan load here.</p>
    <a class="btn" href="../prototype/">Open the app</a>
    <button class="btn o" id="out" type="button">Log out</button>
  </section>

  <p class="note">Prototype only. Accounts are saved in this browser, not on a server.</p>
</main>

<script src="login.js"></script>

</body>
</html>
